<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Relationship Discovery - Web Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-section {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f9f9ff;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .upload-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .file-list {
            margin-top: 15px;
            text-align: left;
        }

        .file-item {
            background: #f5f5f5;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remove-file {
            background: #ff4757;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .progress-section {
            display: none;
            margin-top: 30px;
        }

        .progress-section.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .status-info {
            margin-top: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
        }

        .status-label {
            color: #666;
            font-weight: 500;
        }

        .status-value {
            color: #333;
            font-weight: 600;
        }

        .log-section {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #4a5568;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .result-section {
            display: none;
            margin-top: 30px;
        }

        .result-section.active {
            display: block;
        }

        .result-summary {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .result-summary h3 {
            color: #15803d;
            margin-bottom: 15px;
        }

        .metric {
            display: inline-block;
            margin: 10px 20px 10px 0;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #15803d;
        }

        .metric-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .download-button {
            background: #22c55e;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .download-button:hover {
            background: #16a34a;
        }

        .error-message {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Excel Relationship Discovery</h1>
        <p class="subtitle">Upload Excel files to discover relationships between them</p>

        <!-- Upload Section -->
        <div class="upload-section">
            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls,.xlsm,.csv" multiple>
            <button class="upload-button" id="selectFilesBtn">Select Excel Files</button>
            <p style="margin-top: 10px; color: #666; font-size: 14px;">Max 5 files, 100MB each</p>

            <div class="file-list" id="fileList"></div>

            <button class="upload-button" id="uploadBtn" style="margin-top: 20px; display: none;">
                Start Analysis
            </button>
        </div>

        <!-- Progress Section -->
        <div class="progress-section" id="progressSection">
            <h3 style="margin-bottom: 15px;">Analysis Progress</h3>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>

            <div class="status-info">
                <div class="status-row">
                    <span class="status-label">Job ID:</span>
                    <span class="status-value" id="jobId">-</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Status:</span>
                    <span class="status-value" id="jobStatus">-</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Current Stage:</span>
                    <span class="status-value" id="currentStage">-</span>
                </div>
                <div class="status-row">
                    <span class="status-label">WebSocket:</span>
                    <span class="status-value" id="wsStatus">Disconnected</span>
                </div>
            </div>

            <div class="log-section" id="logSection"></div>
        </div>

        <!-- Result Section -->
        <div class="result-section" id="resultSection">
            <div class="result-summary">
                <h3>✓ Analysis Complete!</h3>

                <div class="metric">
                    <div class="metric-value" id="totalRelationships">0</div>
                    <div class="metric-label">Total Relationships</div>
                </div>

                <div class="metric">
                    <div class="metric-value" id="highConfidence">0</div>
                    <div class="metric-label">High Confidence</div>
                </div>

                <div class="metric">
                    <div class="metric-value" id="mediumConfidence">0</div>
                    <div class="metric-label">Medium Confidence</div>
                </div>

                <div class="metric">
                    <div class="metric-value" id="lowConfidence">0</div>
                    <div class="metric-label">Low Confidence</div>
                </div>

                <div>
                    <button class="download-button" id="downloadBtn">Download Full Report (JSON)</button>
                    <button class="upload-button" id="newAnalysisBtn" style="margin-left: 10px;">New Analysis</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        const API_PREFIX = '/api/v1';

        let selectedFiles = [];
        let currentJobId = null;
        let ws = null;

        // Elements
        const fileInput = document.getElementById('fileInput');
        const selectFilesBtn = document.getElementById('selectFilesBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileList = document.getElementById('fileList');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const jobIdEl = document.getElementById('jobId');
        const jobStatusEl = document.getElementById('jobStatus');
        const currentStageEl = document.getElementById('currentStage');
        const wsStatusEl = document.getElementById('wsStatus');
        const logSection = document.getElementById('logSection');
        const resultSection = document.getElementById('resultSection');
        const downloadBtn = document.getElementById('downloadBtn');
        const newAnalysisBtn = document.getElementById('newAnalysisBtn');

        // Event Listeners
        selectFilesBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelection);
        uploadBtn.addEventListener('click', uploadFiles);
        downloadBtn.addEventListener('click', downloadResult);
        newAnalysisBtn.addEventListener('click', resetUI);

        function handleFileSelection(e) {
            selectedFiles = Array.from(e.target.files).slice(0, 5);
            renderFileList();
        }

        function renderFileList() {
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                uploadBtn.style.display = 'none';
                return;
            }

            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <span>${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                    <button class="remove-file" onclick="removeFile(${index})">Remove</button>
                </div>
            `).join('');

            uploadBtn.style.display = 'block';
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        async function uploadFiles() {
            if (selectedFiles.length === 0) return;

            const formData = new FormData();
            selectedFiles.forEach(file => formData.append('files', file));

            try {
                uploadBtn.disabled = true;
                uploadBtn.textContent = 'Uploading...';

                const response = await fetch(`${API_BASE_URL}${API_PREFIX}/jobs`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Upload failed');
                }

                currentJobId = data.job_id;
                showProgress();
                connectWebSocket(currentJobId);
                addLog(`Job created: ${currentJobId}`);

            } catch (error) {
                alert(`Error: ${error.message}`);
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Start Analysis';
            }
        }

        function showProgress() {
            progressSection.classList.add('active');
            jobIdEl.textContent = currentJobId;
            jobStatusEl.textContent = 'pending';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function connectWebSocket(jobId) {
            const wsUrl = `ws://localhost:8000${API_PREFIX}/jobs/${jobId}/ws`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatusEl.textContent = 'Connected';
                wsStatusEl.style.color = '#22c55e';
                addLog('WebSocket connected');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleWebSocketMessage(message);
            };

            ws.onclose = () => {
                wsStatusEl.textContent = 'Disconnected';
                wsStatusEl.style.color = '#ef4444';
                addLog('WebSocket disconnected');
            };

            ws.onerror = (error) => {
                addLog(`WebSocket error: ${error.message}`);
            };
        }

        function handleWebSocketMessage(message) {
            console.log('WebSocket message:', message);

            if (message.type === 'connected') {
                jobStatusEl.textContent = message.data.status;
                currentStageEl.textContent = message.data.current_stage || '-';
                updateProgress(message.data.progress_percent || 0);
            }
            else if (message.type === 'progress') {
                const { progress_percent, current_stage, message: msg } = message.data;
                updateProgress(progress_percent);
                currentStageEl.textContent = current_stage;
                jobStatusEl.textContent = 'running';
                if (msg) addLog(msg);
            }
            else if (message.type === 'completed') {
                jobStatusEl.textContent = 'completed';
                updateProgress(100);
                addLog('Analysis completed!');
                fetchResult();
            }
            else if (message.type === 'error') {
                jobStatusEl.textContent = 'failed';
                addLog(`Error: ${message.data.error}`);
            }
        }

        function updateProgress(percent) {
            progressFill.style.width = `${percent}%`;
            progressFill.textContent = `${percent}%`;
        }

        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${timestamp}] ${message}`;
            logSection.appendChild(entry);
            logSection.scrollTop = logSection.scrollHeight;
        }

        async function fetchResult() {
            try {
                const response = await fetch(`${API_BASE_URL}${API_PREFIX}/jobs/${currentJobId}/result`);
                const data = await response.json();

                if (data.result) {
                    showResult(data.result);
                }
            } catch (error) {
                addLog(`Error fetching result: ${error.message}`);
            }
        }

        function showResult(result) {
            resultSection.classList.add('active');

            const metadata = result.report_metadata;
            document.getElementById('totalRelationships').textContent = metadata.total_relationships_found;
            document.getElementById('highConfidence').textContent = metadata.high_confidence;
            document.getElementById('mediumConfidence').textContent = metadata.medium_confidence;
            document.getElementById('lowConfidence').textContent = metadata.low_confidence;

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function downloadResult() {
            try {
                const response = await fetch(`${API_BASE_URL}${API_PREFIX}/jobs/${currentJobId}/result`);
                const data = await response.json();

                const blob = new Blob([JSON.stringify(data.result, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `relationship_report_${currentJobId}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert(`Error downloading result: ${error.message}`);
            }
        }

        function resetUI() {
            selectedFiles = [];
            currentJobId = null;
            if (ws) ws.close();

            fileInput.value = '';
            renderFileList();
            progressSection.classList.remove('active');
            resultSection.classList.remove('active');
            logSection.innerHTML = '';
            progressFill.style.width = '0%';
            uploadBtn.disabled = false;
            uploadBtn.textContent = 'Start Analysis';
        }
    </script>
</body>
</html>
